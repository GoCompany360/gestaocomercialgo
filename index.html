<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Master Plan · Tráfego Pago GO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mesmo sistema do Master Plan Schio/Maestro — índice lateral fixo + páginas por hash, cartões de vidro sobre gradiente champagne/navy */
:root{
  --navy:#071739; --navy2:#1c2d55; --gold:#A68868; --gold-l:#cdb89f; --gold-d:#8a6d50; --champ:#efe5d7;
  --bg:#fbf9f6; --paper:#ffffff; --surface:#f5f1ec; --ink:#2b3143; --head:#071739; --muted:#6b7084; --line:#ebe4da; --line2:#e2d7c8;
  --glass:rgba(255,255,255,.72); --shadow:0 18px 40px -26px rgba(7,23,57,.35); --shadow-s:0 8px 22px -16px rgba(7,23,57,.4);
  --hero:linear-gradient(118deg,#f8f2ea 0%,#efe3d2 38%,#e8ebf2 78%,#dfe5f0 100%);
  --gtext:linear-gradient(100deg,#071739 0%,#1c2d55 45%,#A68868 100%);
  --ok:#2f7a4c; --ok-bg:#e4f1e8; --wip:#8a6a48; --wip-bg:#f4ebde; --todo:#a3392e; --todo-bg:#f8e4e0; --req:#2a4a8a; --req-bg:#e7ecf7;
  --live:#071739; --live-fg:#ffffff; --onbtn:#ffffff;
  --side-bg:linear-gradient(180deg,#ffffff 0%,#faf6f0 55%,#f1e8dc 100%);
  --vid:#e8dcc6; --car:#dce3ec; --est:#ece9e4;
  --dv:#1f8a4c; --dc:#1f5fbf; --de:#c8352b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --paper:#121a2c; --surface:#161f34; --ink:#d9dde7; --head:#f1f3f8; --muted:#9aa2b8; --line:#232d45; --line2:#2d3853; --champ:#2a2419;
  --glass:rgba(20,28,46,.72); --shadow:0 18px 40px -26px rgba(0,0,0,.8); --shadow-s:0 8px 22px -16px rgba(0,0,0,.8);
  --hero:linear-gradient(118deg,#1a2338 0%,#1c2440 40%,#2a2a33 80%,#3a3026 100%);
  --gtext:linear-gradient(100deg,#f1f3f8 0%,#d9c4a8 60%,#A68868 100%);
  --ok:#86d3a5; --ok-bg:#173022; --wip:#dcb98f; --wip-bg:#2e2417; --todo:#f0a096; --todo-bg:#3a1c19; --req:#a8bdf0; --req-bg:#1a2647;
  --live:#d9c4a8; --live-fg:#0c1220;
  --side-bg:linear-gradient(180deg,#121a2c 0%,#111827 60%,#1a1a20 100%);
  --vid:#3a3026; --car:#1f2b45; --est:#262a33; --dv:#4cc77f; --dc:#5b9bf0; --de:#f0675c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1220; --paper:#121a2c; --surface:#161f34; --ink:#d9dde7; --head:#f1f3f8; --muted:#9aa2b8; --line:#232d45; --line2:#2d3853; --champ:#2a2419;
  --glass:rgba(20,28,46,.72); --shadow:0 18px 40px -26px rgba(0,0,0,.8); --shadow-s:0 8px 22px -16px rgba(0,0,0,.8);
  --hero:linear-gradient(118deg,#1a2338 0%,#1c2440 40%,#2a2a33 80%,#3a3026 100%);
  --gtext:linear-gradient(100deg,#f1f3f8 0%,#d9c4a8 60%,#A68868 100%);
  --ok:#86d3a5; --ok-bg:#173022; --wip:#dcb98f; --wip-bg:#2e2417; --todo:#f0a096; --todo-bg:#3a1c19; --req:#a8bdf0; --req-bg:#1a2647;
  --live:#d9c4a8; --live-fg:#0c1220;
  --side-bg:linear-gradient(180deg,#121a2c 0%,#111827 60%,#1a1a20 100%);
  --vid:#3a3026; --car:#1f2b45; --est:#262a33; --dv:#4cc77f; --dc:#5b9bf0; --de:#f0675c; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:'Red Hat Display',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 700px at 100% -10%,rgba(166,136,104,.16),transparent 60%),radial-gradient(900px 700px at -10% 110%,rgba(28,45,85,.10),transparent 60%),var(--bg);background-attachment:fixed}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a{color:inherit}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}}

.prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:60}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-l),var(--gold),var(--navy2));transition:width .6s cubic-bezier(.2,.7,.2,1)}

.shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.side{background:var(--side-bg);border-right:1px solid var(--line2);position:sticky;top:0;height:100vh;overflow-y:auto;padding:34px 22px 30px 28px;scrollbar-width:thin}
.wm{display:inline-flex;align-items:baseline;gap:0;font-weight:500;letter-spacing:.07em;font-size:25px;line-height:1;color:var(--gold-d);text-decoration:none}
.wm b{font-weight:700}
.wm sup{font-size:9px;letter-spacing:0;margin-left:2px;font-weight:600}
.wm.mb{font-size:17px}
.side .doc{margin:26px 0 22px;padding:20px 20px 18px;border-radius:16px;background:var(--hero);border:1px solid var(--line2)}
.side .doc b{display:block;font-size:28px;color:var(--head);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.side .doc span{display:block;font-size:14.5px;color:var(--muted);margin-top:6px;font-weight:500}
.toc{list-style:none;margin:0;padding:0}
.toc .ch{font-size:13.5px;font-weight:700;color:var(--gold-d);margin:22px 0 8px 4px;display:flex;align-items:center;gap:10px}
.toc .ch::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.toc a{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:15.5px;color:var(--ink);padding:8px 10px;border-radius:10px;line-height:1.3;transition:background .2s ease,transform .2s ease}
.toc a .pn{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line2);background:var(--paper);font-variant-numeric:tabular-nums}
.toc a:hover{background:rgba(166,136,104,.10);transform:translateX(2px)}
.toc a[aria-current="page"]{color:var(--head);font-weight:700;background:linear-gradient(90deg,rgba(166,136,104,.22),rgba(166,136,104,.04));box-shadow:inset 0 0 0 1px rgba(166,136,104,.25)}
.toc a[aria-current="page"] .pn{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--onbtn);border-color:transparent}
.toc a .mini{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.side .upd{margin-top:28px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line2);padding-top:16px}
.side .upd b{color:var(--head);font-size:15px}

.mbar{display:none}
main{min-width:0}
.page{display:none;max-width:980px;margin:0 auto;padding:44px 52px 48px}
.page.on{display:block}
.page.on>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}}

.ph{position:relative;overflow:hidden;border-radius:22px;padding:40px 44px 38px;margin:0 0 34px;background:var(--hero);background-size:200% 200%;animation:drift 18s ease-in-out infinite alternate;border:1px solid var(--line2);box-shadow:var(--shadow)}
@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}
.ph .bignum{position:absolute;right:34px;bottom:-26px;font-size:150px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(166,136,104,.55);letter-spacing:-.04em;pointer-events:none;font-variant-numeric:tabular-nums}
.ph .chap{position:relative;font-size:14.5px;font-weight:700;color:var(--gold-d);margin:0 0 10px;display:inline-flex;align-items:center;gap:10px}
.ph .chap::before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px}
.ph h1{position:relative;font-size:clamp(32px,4.4vw,52px);line-height:1.04;margin:0;font-weight:800;letter-spacing:-.025em;background:var(--gtext);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:13em;text-wrap:balance}
.ph .tagl{position:relative;margin:12px 0 0;color:var(--muted);font-size:15.5px;font-weight:600;max-width:34em}
.lead{font-size:21px;line-height:1.5;color:var(--head);font-weight:500;margin:0 0 28px;max-width:40em}
h2{font-size:24px;color:var(--head);margin:46px 0 14px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2::before{content:"";width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--gold-l),var(--gold-d));transform:rotate(45deg);flex:none}
h3{font-size:18px;color:var(--head);margin:26px 0 8px;font-weight:700}
p{margin:0 0 15px;max-width:46em}
ul{margin:0 0 18px;padding-left:22px;max-width:46em}
li{margin-bottom:8px}
ul li::marker{color:var(--gold)}
strong{color:var(--head);font-weight:700}
.small{font-size:14.5px;color:var(--muted)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:60px}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:3px;padding:16px 20px;border:1px solid var(--line2);border-radius:14px;background:var(--glass);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.pager a:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold-l)}
.pager a small{font-size:13px;color:var(--gold-d);font-weight:600}
.pager a b{color:var(--head);font-size:17px}
.pager .nx{grid-column:2;text-align:right}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 30px}
.facts div{padding:20px 20px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--line2);box-shadow:var(--shadow-s);position:relative;overflow:hidden;min-width:0}
.facts div::after{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-l),var(--gold),transparent)}
.facts b{display:block;font-size:31px;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:var(--gtext);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.facts span{font-size:14px;color:var(--muted);line-height:1.4;display:block}
.scroll{overflow-x:auto;margin:8px 0 26px;border:1px solid var(--line2);border-radius:14px;background:var(--paper);box-shadow:var(--shadow-s)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
th{text-align:left;color:var(--head);font-weight:700;padding:13px 16px;font-size:13.5px;white-space:nowrap;background:linear-gradient(180deg,var(--surface),var(--paper));border-bottom:1px solid var(--line2)}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:top}
thead+tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:rgba(166,136,104,.06)}
td.k{font-weight:700;color:var(--head)}
.num,td.c,th.c{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
tr.tot td{font-weight:800;color:var(--head);background:var(--surface)}
.note{position:relative;background:linear-gradient(120deg,rgba(166,136,104,.16),rgba(166,136,104,.05) 70%,transparent);border:1px solid rgba(166,136,104,.3);padding:18px 22px 18px 24px;margin:18px 0 26px;border-radius:14px;max-width:48em}
.note::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--gold-l),var(--gold-d))}
.note p:last-child{margin-bottom:0}
.note.warn{background:linear-gradient(120deg,var(--todo-bg),transparent 80%);border-color:var(--line2)}
.note.warn::before{background:var(--todo)}
.st{display:inline-block;font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg)} .st.wip{color:var(--wip);background:var(--wip-bg)} .st.todo{color:var(--todo);background:var(--todo-bg)} .st.req{color:var(--req);background:var(--req-bg)} .st.fut{color:var(--muted);border:1px dashed var(--muted)} .st.live{color:var(--live-fg);background:var(--live)}
.fmt{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:6px;color:var(--head);white-space:nowrap}
.fmt.Vídeo{background:var(--vid)} .fmt.Carrossel{background:var(--car)} .fmt.Estático{background:var(--est)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 26px}
.kv{padding:18px 20px;border-radius:16px;border:1px solid var(--line2);background:var(--glass);min-width:0}
.kv small{display:block;font-size:13px;font-weight:700;color:var(--gold-d);margin-bottom:4px}
.kv p{margin:0;font-size:15.5px;color:var(--ink)}
.req-list{list-style:none;padding:0;margin:0 0 22px;max-width:none;display:grid;gap:10px}
.req-list li{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding:15px 18px;border:1px solid var(--line2);border-radius:12px;background:var(--glass);margin:0}
.req-list small{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:3px}

.cover{position:relative;border-radius:28px;overflow:hidden;background:var(--hero);background-size:200% 200%;animation:drift 18s ease-in-out infinite alternate;border:1px solid var(--line2);box-shadow:var(--shadow);padding:64px 64px 56px}
.cover .eyebrow{font-size:15.5px;color:var(--gold-d);font-weight:600;margin-bottom:22px}
.cover h1{font-size:clamp(48px,7vw,96px);line-height:.92;margin:0 0 22px;font-weight:800;letter-spacing:-.04em;background:var(--gtext);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover h1::after{content:"";display:block;width:64px;height:3px;border-radius:3px;margin-top:22px;background:linear-gradient(90deg,var(--gold),var(--gold-l))}
.cover .sub{font-size:24px;color:var(--head);font-weight:600;margin:0 0 6px}
.cover .sub2{color:var(--muted);margin:0 0 30px;font-size:17px;max-width:36em}
.cover .bigq{position:absolute;right:40px;bottom:-40px;font-size:220px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(166,136,104,.4);letter-spacing:-.05em;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(120deg,#071739 0%,#1c2d55 55%,#8a6d50 130%);padding:14px 26px;border-radius:99px;box-shadow:0 14px 30px -16px rgba(7,23,57,.7);transition:transform .25s ease}
.btn:hover{transform:translateY(-2px)}
.covergrid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:40px;max-width:760px}
.covergrid a{text-decoration:none;padding:12px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--head);line-height:1.3;transition:transform .2s ease,border-color .2s ease}
.covergrid a small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.covergrid a:hover{transform:translateY(-2px);border-color:var(--gold-l)}

.road{list-style:none;padding:0;margin:10px 0 28px;max-width:none}
.road li{display:grid;grid-template-columns:44px 1fr;gap:18px;margin:0;padding-bottom:22px;position:relative}
.road li::before{content:"";position:absolute;left:21px;top:44px;bottom:2px;width:2px;background:linear-gradient(180deg,var(--gold-l),var(--line))}
.road li:last-child::before{display:none}
.road .dot{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.road .dot.now{border:0;color:#fff;background:linear-gradient(135deg,var(--gold-l),var(--gold-d));box-shadow:0 0 0 6px rgba(166,136,104,.16);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(166,136,104,.06)}}
.road li>div:last-child{padding:12px 18px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--glass);min-width:0}
.road h3{margin:0 0 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.road p{margin:0;color:var(--muted);font-size:15.5px}

.week{list-style:none;padding:0;margin:0 0 20px;max-width:none;display:grid;gap:12px}
.week>li{display:grid;grid-template-columns:58px 1fr auto;gap:18px;padding:18px 20px;border:1px solid var(--line2);border-radius:16px;background:var(--glass);margin:0;transition:transform .25s ease,box-shadow .25s ease}
.week>li:hover{transform:translateY(-2px);box-shadow:var(--shadow-s)}
.week>li>div{min-width:0}
.week .d{font-size:34px;font-weight:800;line-height:1;background:var(--gtext);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.week .d small{display:block;font-size:12.5px;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:600;margin-top:6px}
.week h3{margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:17px}
.week p{margin:0 0 6px;font-size:15.5px}
.week .who{font-size:15px;color:var(--head);font-weight:700;margin-top:8px;padding-left:12px;border-left:2px solid var(--gold)}
.week .who small{display:block;font-size:12.5px;color:var(--gold-d);font-weight:600}
.week .obs{font-size:13px;color:var(--todo);font-weight:600;margin-top:8px}
.week>li.isnow{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

.wkcard{padding:24px 26px;border-radius:20px;background:var(--hero);border:1px solid var(--line2);box-shadow:var(--shadow);margin:0 0 26px}
.wkcard-top{display:flex;flex-wrap:wrap;gap:16px 30px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.wk-lbl{display:block;font-size:14.5px;font-weight:700;color:var(--gold-d);margin-bottom:4px}
.wkcard-top .pct{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em;background:var(--gtext);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.wk-sub{font-size:15px;color:var(--muted);margin-left:8px}
.wk-counts{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14.5px;color:var(--muted)}
.wk-counts b{color:var(--head);font-variant-numeric:tabular-nums}
.wk-counts i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.c-live{background:var(--live)}.c-ok{background:var(--ok)}.c-req{background:var(--req)}.c-wip{background:var(--gold)}.c-todo{background:var(--todo)}.c-fut{background:var(--muted)}
.wkbar{height:14px;border-radius:99px;background:var(--paper);border:1px solid var(--line2);overflow:hidden;display:flex}
.wkbar i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.wkbar i.a{background:linear-gradient(90deg,var(--gold),var(--navy2))}
.wkbar i.b{background:var(--gold-l)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.filters button{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line2);border-radius:99px;padding:6px 15px;cursor:pointer;transition:all .2s ease}
.filters button:hover{border-color:var(--gold-l);color:var(--head)}
.filters button[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(120deg,#A68868,#8a6d50)}
.filters .lbl{font-size:13px;font-weight:700;color:var(--gold-d);align-self:center;margin-right:4px;min-width:84px}
.people button[aria-pressed="true"]{background:linear-gradient(120deg,#071739,#1c2d55 60%,#8a6d50 140%)}

select.sts{font:inherit;font-size:13px;font-weight:700;padding:4px 26px 4px 11px;border-radius:99px;border:0;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat;align-self:start;white-space:nowrap}
select.sts.todo{color:var(--todo);background-color:var(--todo-bg)} select.sts.wip{color:var(--wip);background-color:var(--wip-bg)} select.sts.req{color:var(--req);background-color:var(--req-bg)} select.sts.ok{color:var(--ok);background-color:var(--ok-bg)} select.sts.live{color:var(--live-fg);background-color:var(--live)} select.sts.fut{color:var(--muted);background-color:var(--surface)}
select.sts:disabled{cursor:default;opacity:.85}

const PLAN = [ // semana -> peças (mesmo organograma dos demais)
  ["V","E"],["C","E"],["V","C"], ["V"],["C","E"],["V"],["C"], ["V","E"],["C","E"],["V","C"]];

function customRows(p, pi){
  const off = {"Terça":1,"Quarta":2,"Quinta":3,"Sexta":4}[p.dia] || 4;
  const rows = []; let k = 0;
  PLAN.forEach((ws, wi)=>{
    const d = pd(WEEK_MON[wi]); d.setDate(d.getDate()+off);
    let iso = d.toISOString().slice(0,10);
    while (HOLI.includes(iso)){ d.setDate(d.getDate()-1); iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    ws.forEach(t=>{ k++; rows.push({id:`${p.pid}-${String(k).padStart(2,"0")}`, m: wi<3?"Outubro":wi<7?"Novembro":"Dezembro", w:D.weeks[wi], d:iso, p:pi, f:FMTN[t],
      t:"Tema a definir", i:"Descreva aqui a ideia do criativo.", c:"Escreva aqui a chamada principal.", cta:"Fale com um consultor no WhatsApp", o:""}); });
  });
  return rows;

function syncProjects(list){
  D.projs.splice(BASE_N); D.rows = D.rows.filter(r=>r.p < BASE_N);
  for (let i = pages.length-1; i>=0; i--) if (pages[i].proj && pages[i].id.startsWith("emp-")) pages.splice(i,1);
  list.sort((a,b)=>(a.criado||0)-(b.criado||0)).forEach(doc=>{
    const p = {n:doc.nome, dia:doc.dia||"Sexta", custom:true, pid:doc.id, cta:"Fale com um consultor no WhatsApp",
      b:[doc.loc || "Cidade · localização · produto", "Argumentos-chave do empreendimento.", "Condição comercial a definir.", "Tom de comunicação a definir.", "Público principal a definir.", "O que validar com a construtora antes de publicar."]};
    const pi = D.projs.push(p) - 1;
    D.rows.push(...customRows(p, pi));
    const at = pages.findIndex(x=>x.id==="novo-empreendimento");
    pages.splice(at, 0, projPage(p));
  });
  D.rows.sort((a,b)=>a.d.localeCompare(b.d) || a.p-b.p);
  byProj = D.projs.map((_,i)=>D.rows.filter(r=>r.p===i));
  pages.forEach(pg=>{ if (!main.querySelector(`[data-id="${pg.id}"]`)) main.insertAdjacentHTML("beforeend", `<article class="page" data-id="${pg.id}"></article>`); });
  main.querySelectorAll(".page").forEach(a=>{ if (!pages.some(pg=>pg.id===a.dataset.id)) a.remove(); });
  if (curSec==="tr") buildToc("tr");
  const want = location.hash.slice(1);
  if (want!==cur && pages.some(pg=>pg.id===want)) { go(); return false; }
  if (!pages.some(pg=>pg.id===cur)) { location.hash = "#novo-empreendimento"; return false; }
  return true;
}

function gcal(title, iso, details, loc){
  const d = pd(iso), n = new Date(d); n.setDate(d.getDate()+1);
  const f = x => `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`;
  const q = new URLSearchParams({action:"TEMPLATE", text:title, dates:`${f(d)}/${f(n)}`, details:details + "\n\nMaster Plan GO Company", ctz:"America/Sao_Paulo"});
  if (loc) q.set("location", loc);
  return `<a class="gcal" href="https://calendar.google.com/calendar/render?${q.toString()}" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><path d="M1.5 6.5h13M5 1v3M11 1v3"/></svg>Adicionar ao Google Agenda</a>`;
}

const quem = id => { const q = atrib[id] || defQuem(id); return people().includes(q) ? q : "A definir"; };
function whoSel(id){
  const q = quem(id);
  if (!canWrite) return `<span class="chip">${esc(q)}</span>`;
  return `<select class="inp whosel" data-atrib="${id}" aria-label="Responsável">${people().map(n=>`<option${n===q?" selected":""}>${esc(n)}</option>`).join("")}</select>`;
}

const main = document.getElementById("main"), toc = document.getElementById("toc");
const secPages = s => pages.filter(p=>p.sec===s);
function buildToc(sec){
  let lastCh = "";
  toc.innerHTML = secPages(sec).map((pg,i)=>{
    let h = ""; if (pg.ch!==lastCh){ h += `<li class="ch">${pg.ch}</li>`; lastCh = pg.ch; }
    return h + `<li><a href="#${pg.id}"><span class="pn">${pg.pn || i}</span><span>${esc(pg.t)}</span></a></li>`;
  }).join("");
}
main.innerHTML = pages.map(pg=>`<article class="page" data-id="${pg.id}"></article>`).join("");

function bindPage(id, el){
  if (id==="calendario"){
    el.querySelectorAll(".filters").forEach(g=>g.addEventListener("click",e=>{
      const b = e.target.closest("button"); if(!b) return;
      g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
      flt[g.dataset.f] = b.dataset.v; renderCal();
    }));
    renderCal();
  }
  if (id==="novo-empreendimento"){
    const f = el.querySelector("#addProj");
    f?.addEventListener("submit", async e=>{
      e.preventDefault(); if (!db) return;
      const nome = f.querySelector("#pNome").value.trim(); if (!nome) return;
      const btn = f.querySelector("button"); btn.disabled = true;
      try { const ref = await db.collection("projetos").add({nome, dia:f.querySelector("#pDia").value, loc:f.querySelector("#pLoc").value.trim(), criado:Date.now()}); f.reset(); toast(`${nome} criado com 17 peças. Abra a página dele para preencher.`); if (ref?.id) setTimeout(()=>{ location.hash = "#emp-"+ref.id; }, 300); }
      catch(_) { toast("Não foi possível criar o empreendimento."); }
      btn.disabled = false;
    });
  }
  if (id==="imob-agenda"){
    el.querySelector('.filters[data-f="quem"]')?.addEventListener("click", e=>{
      const b = e.target.closest("button"); if (!b) return; agFilter = b.dataset.v; refreshStatusUI();
    });
    const f = el.querySelector("#addPessoa");
    f?.addEventListener("submit", async e=>{
      e.preventDefault(); if (!db) return;
      const nome = f.querySelector("#pesNome").value.trim(); if (!nome || people().includes(nome)) return;
      try { await db.collection("pessoas").add({nome, criado:Date.now()}); toast(`${nome} entrou na equipe. Escolha as atividades dele(a) no campo Responsável.`); }
      catch(_) { toast("Não foi possível adicionar a pessoa."); }
    });
  }
  if (id==="imob-lista"){
    const f = el.querySelector("#addImob");
    f?.addEventListener("submit", async e=>{
      e.preventDefault(); if (!db) return;
      const nome = f.querySelector("#fNome").value.trim(); if (!nome) return;
      const btn = f.querySelector("button"); btn.disabled = true;
      try { await db.collection("imobiliarias").add({nome, cidade:f.querySelector("#fCid").value, gestor:f.querySelector("#fGes").value.trim(), contato:f.querySelector("#fCon").value.trim(), grupo:f.querySelector("#fGru").value, nc:Math.max(0,parseInt(f.querySelector("#fNc").value,10)||0), status:"Prospectada", proxima:"", vc:0, pr:0, vd:0, criado:Date.now()}); f.reset(); }
      catch(_) { btn.textContent = "Não foi possível salvar"; }
      btn.disabled = false;
    });
  }
}
function renderPage(id){
  const pg = pages.find(p=>p.id===id), list = secPages(pg.sec), i = list.indexOf(pg);
  const el = main.querySelector(`[data-id="${id}"]`);
  const prev = list[i-1], next = list[i+1];
  CURNUM = String(i);
  el.innerHTML = pg.html() + `<nav class="pager">${prev?`<a href="#${prev.id}"><small>← Anterior</small><b>${esc(prev.t)}</b></a>`:""}${next?`<a class="nx" href="#${next.id}"><small>Próximo →</small><b>${esc(next.t)}</b></a>`:""}</nav>`;
  bindPage(id, el);
}

  let id = location.hash.slice(1);

let pending = false;
function refreshStatusUI(){
  const a = document.activeElement;
  if (a && main.contains(a) && (a.matches("input, textarea") || a.isContentEditable)) { pending = true; return; } // não interrompe digitação
  pending = false;
  const y = window.scrollY;
  if (cur==="calendario"){
    const el = main.querySelector('[data-id="calendario"] [data-prog]');
    if (el) el.outerHTML = progressCard(D.rows,"Trimestre · todos os empreendimentos");

async function saveEd(el){
  if (!db) return;
  const k = el.dataset.key, d = el.dataset.def;
  const v = el.textContent.replace(/\u00a0/g," ").trim();
  if (v === V(k,d)) return;
  try {
    if (!v || v === d){ delete TX[k]; await db.collection("txt").doc(k).delete(); }
    else { TX[k] = v; await db.collection("txt").doc(k).set({v}); }
    const r = D.rows.find(x=>k.startsWith(x.id+"."));
    toast(!v || v===d ? "Texto original restaurado em todo o painel."
      : r ? `Salvo. Atualizado no Calendário completo e na página do ${D.projs[r.p].n}.`
      : "Salvo. Atualizado em todo o painel.");
  } catch(_) { el.classList.add("err"); toast("Não foi possível salvar. Tente de novo."); }
}
let toastT;
function toast(msg){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2800);
}
main.addEventListener("keydown", e=>{
  const el = e.target.closest?.(".ed"); if (!el) return;
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); el.blur(); }
  if (e.key==="Escape"){ el.textContent = V(el.dataset.key, el.dataset.def); el.blur(); }
});
main.addEventListener("focusout", e=>{ const el = e.target.closest?.(".ed"); if (el) saveEd(el); }, true);

  if (s){

    catch(err){ status[id] = old; toast("Não foi possível salvar o status."); }

  }
  const is = e.target.closest("select.ists");
  if (is){
    const id = is.dataset.id, k = is.dataset.k, v = is.value, old = istatus[id];
    istatus[id] = v; is.className = "sts ists " + iCls(k,v);
    try { await db.collection("imobst").doc(id).set({s:v}); }
    catch(err){ if (old) istatus[id] = old; else delete istatus[id]; }
    return refreshStatusUI();
  }
  const ws = e.target.closest("[data-atrib]");
  if (ws){
    const id = ws.dataset.atrib, v = ws.value; atrib[id] = v;
    try { await db.collection("atrib").doc(id).set({quem:v}); toast(`Atividade atribuída a ${v}.`); } catch(_) { toast("Não foi possível salvar o responsável."); }
    return refreshStatusUI();

  const fld = e.target.closest("[data-fld]");
  if (fld){
    const rid = fld.closest("tr").dataset.r, f = fld.dataset.fld;
    let v = fld.value; if (["vc","pr","vd","nc"].includes(f)) v = Math.max(0, parseInt(v,10)||0);
    if (f==="status") fld.className = "sts " + FUNC[v];

main.addEventListener("click", async e=>{

  if (rs && db){ const id = rs.dataset.reset; for (const k of [id+".t", id+".c"]){ if (k in TX){ delete TX[k]; try { await db.collection("txt").doc(k).delete(); } catch(_) {} } } refreshStatusUI(); return; }

/* Armazenamento local: usado quando o banco compartilhado não está disponível
   (ex.: arquivo HTML aberto fora do Claude). Salva neste navegador. */
function localDb(){
  const mem = {}, subs = {};
  const load = n => { if (mem[n]) return mem[n]; let saved = null; try { saved = localStorage.getItem("gomp:"+n); } catch(_) {} try { mem[n] = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(SEED[n] || {})); } catch(_) { mem[n] = {}; } return mem[n]; };
  const persist = n => { try { localStorage.setItem("gomp:"+n, JSON.stringify(mem[n])); } catch(_) {} };
  const emit = n => { const data = load(n); const snap = {docs:Object.keys(data).map(id=>({id, data:()=>data[id]}))}; (subs[n]||[]).forEach(cb=>cb(snap)); };
  const collection = n => ({
    limit(){ return this; },
    onSnapshot(cb){ (subs[n] = subs[n]||[]).push(cb); setTimeout(()=>emit(n),0); return ()=>{}; },
    doc(id){ return {
      async set(v){ load(n)[id] = {...v}; persist(n); emit(n); },
      async update(v){ const d = load(n); d[id] = {...(d[id]||{}), ...v}; persist(n); emit(n); },
      async delete(){ delete load(n)[id]; persist(n); emit(n); }
    }; },
    async add(v){ const id = "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); load(n)[id] = {...v}; persist(n); emit(n); return {id}; }
  });
  const snapshot = () => Object.fromEntries(["status","txt","imobst","imobiliarias","projetos","pessoas","atrib"].map(n=>[n, load(n)]));
  return {collection, local:true, snapshot};
}
(async ()=>{
  try {
    db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) db = localDb();
    canWrite = true;
    const hint = document.getElementById("edHint");
    if (db.local){

      const xb = document.getElementById("exportBtn"); xb.hidden = false;
      xb.addEventListener("click", ()=>{

        const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
        const link = document.createElement("a"); link.href = url; link.download = "MasterPlan_GO.html";
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
        toast("Arquivo MasterPlan_GO.html salvo com todas as alterações.");
      });
    }
    refreshStatusUI();
    db.collection("status").limit(1000).onSnapshot(snap=>{
      for (const k in status) delete status[k];
      snap.docs.forEach(d=>{ const v = d.data()?.s; if (STC[v]) status[d.id] = v; });
      refreshStatusUI();
    }, ()=>{});
    document.getElementById("edHint").hidden = false;
    db.collection("txt").limit(1000).onSnapshot(snap=>{
      for (const k in TX) delete TX[k];
      snap.docs.forEach(d=>{ const v = d.data()?.v; if (typeof v==="string") TX[d.id] = v; });
      refreshStatusUI();
    }, ()=>{});
    db.collection("projetos").limit(200).onSnapshot(snap=>{
      if (syncProjects(snap.docs.map(d=>({id:d.id, ...(d.data()||{})})).filter(x=>x.nome))) refreshStatusUI();
    }, ()=>{});
    db.collection("pessoas").limit(200).onSnapshot(snap=>{
      pessoas = snap.docs.map(d=>({id:d.id, ...(d.data()||{})})).filter(x=>x.nome);
      refreshStatusUI();
    }, ()=>{});
    db.collection("atrib").limit(1000).onSnapshot(snap=>{
      for (const k in atrib) delete atrib[k];
      snap.docs.forEach(d=>{ const v = d.data()?.quem; if (typeof v==="string") atrib[d.id] = v; });
      refreshStatusUI();
    }, ()=>{});
    db.collection("imobst").limit(1000).onSnapshot(snap=>{
      for (const k in istatus) delete istatus[k];
      snap.docs.forEach(d=>{ const v = d.data()?.s; if (typeof v==="string") istatus[d.id] = v; });
      refreshStatusUI();
    }, ()=>{});
    db.collection("imobiliarias").limit(1000).onSnapshot(snap=>{
      imobs = snap.docs.map(d=>({id:d.id, ...(d.data()||{})})).filter(r=>r.nome);
      imobLoaded = true;
      refreshStatusUI();
    }, ()=>{ imobLoaded = true; refreshStatusUI(); });
  } catch(_) {}
})();
